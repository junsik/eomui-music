<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어무이 음악</title>
<style>
  /*
    시니어 사용자용 화면.
    - 글씨와 버튼을 크게. 화면 배율이 150%면 여기서 한 번 더 커진다.
    - rem 을 쓰므로 브라우저 글꼴 크기 설정도 그대로 따라간다.
    - 색 대비를 높게 유지한다.
  */
  :root {
    --rose: #e11d48;
    --rose-dark: #be123c;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 20px; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    background: #fdf2f8;
    color: var(--ink);
    line-height: 1.5;
    padding: 1rem;
  }
  .wrap { max-width: 46rem; margin: 0 auto; }

  header {
    background: #fff;
    border-radius: 1rem;
    padding: 1.2rem 1.4rem;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.8rem; letter-spacing: -.02em; }
  .status {
    margin-top: .7rem;
    display: flex; align-items: center; gap: .5rem;
    font-size: 1.05rem; font-weight: 700;
    padding: .7rem 1rem; border-radius: .7rem;
    background: #f0fdf4; border: 2px solid #22c55e; color: #14532d;
  }
  .status.busy { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
  .status.down { background: #fef2f2; border-color: #ef4444; color: #7f1d1d; }
  .dot {
    width: .7rem; height: .7rem; border-radius: 50%;
    background: currentColor; flex: 0 0 auto;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }

  .songs {
    background: #fff;
    border-radius: 1rem;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .song {
    display: flex; align-items: center; gap: 1rem;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--line);
  }
  .song:last-child { border-bottom: none; }
  .song-info { flex: 1 1 auto; min-width: 0; }
  .song-title {
    font-size: 1.25rem; font-weight: 700;
    overflow-wrap: anywhere;
  }
  .song-meta { font-size: .85rem; color: var(--muted); margin-top: .2rem; }

  button {
    font-family: inherit;
    font-size: 1.1rem; font-weight: 700;
    border: none; border-radius: .7rem;
    cursor: pointer;
    min-height: 3.2rem;
    padding: 0 1.4rem;
    transition: background .12s;
  }
  button:disabled { opacity: .5; cursor: default; }
  .play {
    background: var(--rose); color: #fff;
    flex: 0 0 auto;
  }
  .play:hover:not(:disabled) { background: var(--rose-dark); }
  .play.done { background: #16a34a; }

  .more {
    width: 100%; min-height: 3.6rem;
    background: #fff; color: var(--ink);
    border: 2px solid var(--line);
    margin-bottom: 1rem;
  }
  .more:hover:not(:disabled) { background: #f9fafb; }

  .actions { display: grid; gap: .7rem; }
  .actions button {
    width: 100%; min-height: 3.8rem;
    background: #fff; color: var(--ink);
    border: 2px solid var(--line);
    text-align: left; padding-left: 1.2rem;
  }
  .actions button:hover:not(:disabled) { background: #f9fafb; }

  .empty, .note {
    padding: 2rem 1.2rem; text-align: center;
    color: var(--muted); font-size: 1.05rem;
  }
  .note { padding: 1rem 0 0; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>&#9835; 어무이 음악</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">확인 중</span></div>
  </header>

  <div class="songs" id="songs">
    <div class="empty">불러오는 중...</div>
  </div>

  <button class="more" id="more" hidden>더 보기</button>

  <div class="actions">
    <button id="openFolder">&#128193;&nbsp; 음악 폴더 열기</button>
    <button id="tidy">&#129529;&nbsp; 바탕화면 정리하기</button>
  </div>

  <p class="note">이 창은 닫으셔도 됩니다. 프로그램은 계속 실행됩니다.</p>
</div>

<script>
// 서버가 이 헤더로 우리 화면의 요청인지 구분한다.
const HEADERS = { "X-Eomui-Client": "1" };
const PAGE_SIZE = 20;

let offset = 0;
let total = 0;

const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const res = await fetch(path, { headers: HEADERS, ...options });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `오류 (${res.status})`);
  }
  return res.json();
}

// ── 상태 표시 ────────────────────────────────────────────────
async function refreshStatus() {
  const box = $("status");
  const text = $("statusText");
  try {
    const s = await api("/api/status");
    if (s.ready) {
      box.className = "status";
      text.textContent = "준비 완료";
    } else {
      box.className = "status busy";
      text.textContent = s.setup || "준비 중";
      setTimeout(refreshStatus, 2000);
    }
  } catch (e) {
    box.className = "status down";
    text.textContent = "프로그램이 꺼져 있어요";
    setTimeout(refreshStatus, 3000);
  }
}

// ── 곡 목록 ──────────────────────────────────────────────────
function songRow(song) {
  const row = document.createElement("div");
  row.className = "song";

  const info = document.createElement("div");
  info.className = "song-info";

  const title = document.createElement("div");
  title.className = "song-title";
  title.textContent = song.title;

  const meta = document.createElement("div");
  meta.className = "song-meta";
  meta.textContent = `${song.downloaded} · ${song.where}`;

  info.append(title, meta);

  const play = document.createElement("button");
  play.className = "play";
  play.textContent = "듣기";
  play.onclick = () => playSong(song, play);

  row.append(info, play);
  return row;
}

async function playSong(song, button) {
  const original = button.textContent;
  button.disabled = true;
  try {
    await api("/api/play?path=" + encodeURIComponent(song.path));
    button.textContent = "재생 중";
    button.classList.add("done");
  } catch (e) {
    button.textContent = "안 열려요";
  }
  setTimeout(() => {
    button.textContent = original;
    button.classList.remove("done");
    button.disabled = false;
  }, 2500);
}

async function loadMore() {
  const list = $("songs");
  const more = $("more");
  more.disabled = true;

  try {
    const data = await api(`/api/songs?offset=${offset}&limit=${PAGE_SIZE}`);
    total = data.total;

    if (offset === 0) {
      list.textContent = "";
      if (total === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 받은 노래가 없어요.";
        list.append(empty);
      }
    }
    data.songs.forEach((s) => list.append(songRow(s)));
    offset += data.songs.length;

    const left = total - offset;
    more.hidden = left <= 0;
    more.textContent = `더 보기 (${left}곡 남음)`;
  } catch (e) {
    if (offset === 0) {
      list.textContent = "";
      const err = document.createElement("div");
      err.className = "empty";
      err.textContent = "목록을 불러오지 못했어요.";
      list.append(err);
    }
  }
  more.disabled = false;
}

// ── 아래쪽 버튼 ──────────────────────────────────────────────
$("more").onclick = loadMore;

$("openFolder").onclick = async (e) => {
  e.target.disabled = true;
  try { await api("/api/open-folder"); } catch (_) {}
  setTimeout(() => (e.target.disabled = false), 1500);
};

$("tidy").onclick = async (e) => {
  if (!confirm("바탕화면에 흩어진 MP3를 정리할까요?\n\n최근 곡은 바탕화면에 그대로 두고,\n나머지는 '음악 보관함' 폴더로 옮깁니다.")) return;

  e.target.disabled = true;
  const label = e.target.textContent;
  e.target.textContent = "정리하는 중...";
  try {
    const r = await api("/api/tidy", { method: "POST" });
    alert(`정리했습니다.\n\n바탕화면에 ${r.onDesktop}곡, 보관함에 ${r.archived}곡.`);
    offset = 0;
    await loadMore();
  } catch (err) {
    alert("정리하지 못했습니다.\n" + err.message);
  }
  e.target.textContent = label;
  e.target.disabled = false;
};

refreshStatus();
loadMore();
</script>
</body>
</html>
